<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — IKEWs Scheduler</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    .tabs {
      display: flex;
      gap: 0;
      border-bottom: 2px solid var(--gray-200);
      margin-bottom: 20px;
    }
    .tab {
      padding: 10px 20px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: var(--gray-500);
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: all 0.15s;
    }
    .tab.active {
      color: var(--blue-600);
      border-bottom-color: var(--blue-600);
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .user-list { list-style: none; padding: 0; }
    .user-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--gray-200);
      font-size: 14px;
    }
    .user-list li:last-child { border-bottom: none; }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px; }
    .form-group input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--gray-200);
      border-radius: 4px;
      font-size: 14px;
    }
    .form-group input:focus { outline: none; border-color: var(--blue-600); }
    .form-row { display: flex; gap: 12px; }
    .form-row .form-group { flex: 1; }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="/">IKEWs Scheduler</a>
    <div class="nav-user" id="navUser"></div>
  </header>

  <main id="app">
    <div class="loading-wrap"><div class="spinner"></div></div>
  </main>

  <script src="/js/config.js"></script>
  <script type="module">
    import { auth, db, requireAuth, renderNavUser, getUserRole } from "/js/auth.js";
    import {
      collection, getDocs, addDoc, doc, setDoc, deleteDoc,
      query, where, orderBy, getDoc, serverTimestamp, writeBatch,
      httpsCallable, getFunctions
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { getFunctions as getFirebaseFunctions, httpsCallable as callFn }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js";
    import { app } from "/js/auth.js";

    const functions = getFirebaseFunctions(app);

    requireAuth(async (user) => {
      renderNavUser(user);
      const role = await getUserRole(user);
      if (role !== "admin") {
        document.getElementById("app").innerHTML =
          `<div class="alert alert-error">Access denied. Admin only.</div>`;
        return;
      }
      await loadDashboard(user);
    });

    async function loadDashboard(user) {
      const appEl = document.getElementById("app");

      // Fetch all data in parallel
      const [studentsSnap, facultySnap, slotsSnap, signupsSnap] = await Promise.all([
        getDocs(collection(db, "students")),
        getDocs(collection(db, "faculty")),
        getDocs(collection(db, "interviewSlots")),
        getDocs(collection(db, "facultySignups"))
      ]);

      const students = studentsSnap.docs.map(d => ({ email: d.id, ...d.data() }));
      const faculty  = facultySnap.docs.map(d => ({ email: d.id, ...d.data() }));
      const slots    = slotsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      const signups  = signupsSnap.docs.map(d => ({ id: d.id, ...d.data() }));

      // Stats
      const matched         = students.filter(s => s.status === "matched").length;
      const needsNewTimes   = students.filter(s => s.status === "needs_new_times").length;
      const pending         = students.filter(s => s.status === "pending").length;
      const lockedSlots     = slots.filter(s => s.status === "locked").length;
      const pendingSlots    = slots.filter(s => s.status === "pending").length;

      appEl.innerHTML = `
        <h1 class="page-title">Admin Dashboard</h1>

        <!-- Stats -->
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-value">${students.length}</div>
            <div class="stat-label">Total Students</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" style="color:var(--green-600)">${matched}</div>
            <div class="stat-label">Matched</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" style="color:var(--amber-600)">${pending}</div>
            <div class="stat-label">Pending Match</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" style="color:var(--red-600)">${needsNewTimes}</div>
            <div class="stat-label">Needs New Times</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${faculty.length}</div>
            <div class="stat-label">Faculty</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${pendingSlots}</div>
            <div class="stat-label">Open Slots</div>
          </div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
          <div class="tab active" data-tab="overview">Overview</div>
          <div class="tab" data-tab="students">Students</div>
          <div class="tab" data-tab="faculty">Faculty</div>
          <div class="tab" data-tab="slots">Slots</div>
          <div class="tab" data-tab="manage">Manage Users</div>
        </div>

        <!-- Tab: Overview -->
        <div class="tab-panel active" id="tab-overview">
          <div class="card">
            <div class="card-title">Day 7 Reconciliation</div>
            <p style="font-size:14px;margin-bottom:16px">
              Run reconciliation to identify students who were not matched and notify them
              to select new times. This triggers a Cloud Function that emails unmatched students
              with a link to the scheduler.
            </p>
            <button class="btn btn-primary" id="reconcileBtn">Run Reconciliation</button>
            <div id="reconcileStatus" style="margin-top:12px"></div>
          </div>
          <div class="card">
            <div class="card-title">Current Scheduling Window</div>
            <p style="font-size:14px">
              <strong>Student window:</strong>
              ${formatDate(getWindowDates().studentWindowStart)} –
              ${formatDate(new Date(getWindowDates().studentWindowEnd.getTime() - 1))}
            </p>
            <p style="font-size:14px;margin-top:8px">
              <strong>Faculty window:</strong>
              ${formatDate(getWindowDates().facultyWindowStart)} –
              ${formatDate(new Date(getWindowDates().facultyWindowEnd.getTime() - 1))}
            </p>
            <p style="font-size:14px;margin-top:8px">
              <strong>Current phase:</strong>
              <span class="badge badge-pending">${getCurrentWindow()}</span>
            </p>
          </div>
        </div>

        <!-- Tab: Students -->
        <div class="tab-panel" id="tab-students">
          <div class="card">
            <div class="card-title">All Students (${students.length})</div>
            <table class="slot-table">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Status</th>
                  <th>Slots Submitted</th>
                </tr>
              </thead>
              <tbody>
                ${students.map(s => {
                  const studentSlots = slots.filter(sl => sl.studentEmail === s.email);
                  const pending = studentSlots.filter(sl => sl.status === "pending").length;
                  return `<tr>
                    <td>${s.name}</td>
                    <td style="font-size:13px;color:var(--gray-500)">${s.email}</td>
                    <td><span class="badge badge-${s.status || 'pending'}">${s.status || 'pending'}</span></td>
                    <td>${pending} pending</td>
                  </tr>`;
                }).join("")}
              </tbody>
            </table>
          </div>
        </div>

        <!-- Tab: Faculty -->
        <div class="tab-panel" id="tab-faculty">
          <div class="card">
            <div class="card-title">All Faculty (${faculty.length})</div>
            <table class="slot-table">
              <thead>
                <tr><th>Name</th><th>Email</th><th>Signups</th></tr>
              </thead>
              <tbody>
                ${faculty.map(f => {
                  const count = signups.filter(su => su.facultyEmail === f.email).length;
                  return `<tr>
                    <td>${f.name}</td>
                    <td style="font-size:13px;color:var(--gray-500)">${f.email}</td>
                    <td>${count} slots signed up</td>
                  </tr>`;
                }).join("")}
              </tbody>
            </table>
          </div>
        </div>

        <!-- Tab: Slots -->
        <div class="tab-panel" id="tab-slots">
          <div class="card">
            <div class="card-title">All Interview Slots (${slots.length})</div>
            <table class="slot-table">
              <thead>
                <tr><th>Student</th><th>Start Time</th><th>Status</th><th>Faculty Signups</th><th>Meet Link</th></tr>
              </thead>
              <tbody>
                ${slots.map(s => {
                  const start = s.startTime && s.startTime.toDate ? s.startTime.toDate() : (s.startTime ? new Date(s.startTime) : null);
                  const slotSignups = signups.filter(su => su.slotId === s.id);
                  return `<tr>
                    <td style="font-size:13px">${s.studentEmail}</td>
                    <td style="font-size:13px">${start ? formatDateTime(start) : '—'}</td>
                    <td><span class="badge badge-${s.status}">${s.status}</span></td>
                    <td>${slotSignups.map(su => su.facultyEmail).join(", ") || "—"}</td>
                    <td>${s.googleMeetLink ? `<a href="${s.googleMeetLink}" target="_blank" style="font-size:12px">Open</a>` : "—"}</td>
                  </tr>`;
                }).join("")}
              </tbody>
            </table>
          </div>
        </div>

        <!-- Tab: Manage Users -->
        <div class="tab-panel" id="tab-manage">
          <div class="card">
            <div class="card-title">Add Student</div>
            <div class="form-row">
              <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="newStudentName" placeholder="Jane Smith" />
              </div>
              <div class="form-group">
                <label>Email</label>
                <input type="email" id="newStudentEmail" placeholder="student@university.edu" />
              </div>
            </div>
            <button class="btn btn-primary btn-sm" id="addStudentBtn">Add Student</button>
            <div id="addStudentStatus" style="margin-top:8px;font-size:13px"></div>
          </div>

          <div class="card">
            <div class="card-title">Add Faculty</div>
            <div class="form-row">
              <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="newFacultyName" placeholder="Dr. Alex Johnson" />
              </div>
              <div class="form-group">
                <label>Email</label>
                <input type="email" id="newFacultyEmail" placeholder="faculty@university.edu" />
              </div>
            </div>
            <button class="btn btn-primary btn-sm" id="addFacultyBtn">Add Faculty</button>
            <div id="addFacultyStatus" style="margin-top:8px;font-size:13px"></div>
          </div>

          <div class="card">
            <div class="card-title">Bulk Import Students (CSV)</div>
            <p style="font-size:13px;color:var(--gray-500);margin-bottom:12px">
              CSV format: <code>name,email</code> (one per line, no header row needed)
            </p>
            <textarea id="csvInput" rows="6" style="width:100%;padding:8px;border:1px solid var(--gray-200);border-radius:4px;font-size:13px;font-family:monospace"
              placeholder="Jane Smith,jane@university.edu&#10;John Doe,john@university.edu"></textarea>
            <button class="btn btn-primary btn-sm" id="csvImportBtn" style="margin-top:8px">Import</button>
            <div id="csvStatus" style="margin-top:8px;font-size:13px"></div>
          </div>
        </div>`;

      // Tab switching
      document.querySelectorAll(".tab").forEach(tab => {
        tab.addEventListener("click", () => {
          document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
          document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
          tab.classList.add("active");
          document.getElementById(`tab-${tab.dataset.tab}`).classList.add("active");
        });
      });

      // Reconciliation
      document.getElementById("reconcileBtn").addEventListener("click", async () => {
        const btn = document.getElementById("reconcileBtn");
        const statusEl = document.getElementById("reconcileStatus");
        btn.disabled = true;
        btn.textContent = "Running…";
        try {
          const runReconciliation = callFn(functions, "runReconciliation");
          const result = await runReconciliation({});
          statusEl.innerHTML = `<div class="alert alert-success">${result.data.message}</div>`;
        } catch (err) {
          console.error(err);
          statusEl.innerHTML = `<div class="alert alert-error">Error: ${err.message}</div>`;
        }
        btn.disabled = false;
        btn.textContent = "Run Reconciliation";
      });

      // Add student
      document.getElementById("addStudentBtn").addEventListener("click", async () => {
        const name  = document.getElementById("newStudentName").value.trim();
        const email = document.getElementById("newStudentEmail").value.trim().toLowerCase();
        const statusEl = document.getElementById("addStudentStatus");
        if (!name || !email) { statusEl.textContent = "Both fields are required."; return; }
        try {
          await setDoc(doc(db, "students", email), { name, email, status: "pending" });
          statusEl.innerHTML = `<span style="color:var(--green-600)">Added ${name} (${email})</span>`;
          document.getElementById("newStudentName").value = "";
          document.getElementById("newStudentEmail").value = "";
        } catch (err) {
          statusEl.textContent = `Error: ${err.message}`;
        }
      });

      // Add faculty
      document.getElementById("addFacultyBtn").addEventListener("click", async () => {
        const name  = document.getElementById("newFacultyName").value.trim();
        const email = document.getElementById("newFacultyEmail").value.trim().toLowerCase();
        const statusEl = document.getElementById("addFacultyStatus");
        if (!name || !email) { statusEl.textContent = "Both fields are required."; return; }
        try {
          await setDoc(doc(db, "faculty", email), { name, email });
          statusEl.innerHTML = `<span style="color:var(--green-600)">Added ${name} (${email})</span>`;
          document.getElementById("newFacultyName").value = "";
          document.getElementById("newFacultyEmail").value = "";
        } catch (err) {
          statusEl.textContent = `Error: ${err.message}`;
        }
      });

      // CSV import
      document.getElementById("csvImportBtn").addEventListener("click", async () => {
        const csv = document.getElementById("csvInput").value.trim();
        const statusEl = document.getElementById("csvStatus");
        if (!csv) { statusEl.textContent = "No data to import."; return; }

        const lines = csv.split("\n").map(l => l.trim()).filter(Boolean);
        const batch = writeBatch(db);
        let count = 0;
        for (const line of lines) {
          const [name, email] = line.split(",").map(s => s.trim());
          if (name && email) {
            batch.set(doc(db, "students", email.toLowerCase()), {
              name, email: email.toLowerCase(), status: "pending"
            });
            count++;
          }
        }
        try {
          await batch.commit();
          statusEl.innerHTML = `<span style="color:var(--green-600)">Imported ${count} students.</span>`;
          document.getElementById("csvInput").value = "";
        } catch (err) {
          statusEl.textContent = `Error: ${err.message}`;
        }
      });
    }

    function formatDateTime(d) {
      return d.toLocaleDateString("en-US", { weekday:"short", month:"short", day:"numeric" })
        + " " + d.toLocaleTimeString("en-US", { hour:"numeric", minute:"2-digit", hour12:true });
    }
    function formatDate(d) {
      return d.toLocaleDateString("en-US", { weekday:"short", month:"short", day:"numeric" });
    }
  </script>
</body>
</html>
