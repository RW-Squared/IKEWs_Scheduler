<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IKEWs Interview Scheduler</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    .role-chips {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .role-chip {
      padding: 6px 16px;
      border-radius: 20px;
      border: 1.5px solid var(--gray-200);
      font-size: 13px;
      background: var(--white);
      cursor: pointer;
      transition: all 0.15s;
    }
    .role-chip.active {
      border-color: var(--blue-600);
      background: var(--blue-50);
      color: var(--blue-600);
      font-weight: 600;
    }
    #errorMsg {
      display: none;
      margin-top: 16px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="signin-container">
    <div class="signin-card">
      <h1>IKEWs Interview Scheduler</h1>
      <p>Sign in with your university Google account to access the scheduling system.</p>

      <button class="btn-google" id="signInBtn">
        <!-- Google "G" logo -->
        <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.36-8.16 2.36-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          <path fill="none" d="M0 0h48v48H0z"/>
        </svg>
        Sign in with Google
      </button>

      <div class="alert alert-error" id="errorMsg"></div>
    </div>
  </div>

  <!-- Firebase config -->
  <script src="/js/config.js"></script>

  <!-- Firebase SDKs -->
  <script type="module">
    import { app, auth, db, signInWithGoogle, getUserRole } from "/js/auth.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const signInBtn = document.getElementById("signInBtn");
    const errorMsg  = document.getElementById("errorMsg");

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = "block";
    }

    // If already signed in, redirect to correct dashboard
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        const role = await getUserRole(user);
        redirectByRole(role);
      }
    });

    signInBtn.addEventListener("click", async () => {
      errorMsg.style.display = "none";
      signInBtn.disabled = true;
      signInBtn.textContent = "Signing in…";
      try {
        await signInWithGoogle();
        // onAuthStateChanged will handle redirect
      } catch (err) {
        signInBtn.disabled = false;
        signInBtn.innerHTML = `
          <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" style="width:20px;height:20px">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.36-8.16 2.36-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          Sign in with Google`;
        showError("Sign-in failed. Please try again.");
      }
    });

    function redirectByRole(role) {
      if (role === "student") window.location.href = "/student/";
      else if (role === "faculty") window.location.href = "/faculty/";
      else if (role === "admin") window.location.href = "/admin/";
      else showError("Your account is not on the eligible list. Please contact your administrator.");
    }
  </script>
</body>
</html>
